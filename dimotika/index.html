<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Στίχοι και συγχορδίες για την παρέα, με αλλαγή τόνου.">
  <meta name="robots" content="noindex, nofollow">
  <title>Πάνω σε ψηλή ραχούλα</title>
  <link rel="icon" href="./favicon.svg?v=2" type="image/svg+xml">
  <link rel="stylesheet" href="./songbook.css?v=2">
  <script type="module" src="./songbook.mjs?v=3"></script>
</head>
<body>
<main class="shell">
  <header class="song-heading"><h1>Πάνω σε ψηλή ραχούλα</h1></header>
  <p id="unknown-song" role="status" hidden>Το τραγούδι δεν έχει προστεθεί ακόμη. Εμφανίζεται η πιλοτική σελίδα.</p>
  <section class="controls" aria-label="Αλλαγή τόνου">
    <div class="key-controls"><label class="control-label" for="song-key">Τόνος</label>
      <button type="button" id="key-down" class="step" aria-label="Ένα ημιτόνιο κάτω" disabled>−</button>
      <select id="song-key" disabled><option value="D">D · Ρε</option></select>
      <button type="button" id="key-up" class="step" aria-label="Ένα ημιτόνιο πάνω" disabled>+</button>
    </div>
    <button type="button" class="reset" id="reset-key" aria-label="Επαναφορά σε D" title="Επαναφορά σε D" disabled>↺ D</button>
  </section>
  <noscript>Για τις συγχορδίες και την αλλαγή τόνου χρειάζεται ενεργοποιημένη JavaScript στον browser σου.</noscript>
  <article class="score" id="score" aria-label="Στίχοι με συγχορδίες"></article>
  <div class="resources"><a id="youtube" href="https://www.youtube.com/watch?v=h8uxA1S2mBk" target="_blank" rel="noopener noreferrer" aria-label="YouTube · Κουτσώλης / Άρης Ντίνας">YouTube ↗</a><button type="button" class="copy-button" id="copy-link" disabled>Αντιγραφή συνδέσμου</button></div>
  <p role="status" class="copy-status" id="copy-status"></p>
  <label class="manual-link" id="manual-link" hidden>Σύνδεσμος με τον επιλεγμένο τόνο<input id="share-url" readonly></label>
</main>
</body>
</html>
